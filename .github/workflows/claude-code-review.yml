name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: namespace-profile-claude
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0

      - name: Probe current Claude SDK and CLI
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            This is an isolated CI diagnostic. Reply with exactly: diagnostic-ok
          claude_args: |
            --model claude-opus-5
            --max-turns 1

      - name: Summarize Claude diagnostic output
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.claude.outcome }}
          ACTION_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          echo "action_outcome=$ACTION_OUTCOME"
          echo "action_conclusion=$ACTION_CONCLUSION"
          echo "execution_file=$EXECUTION_FILE"
          if [[ -n "$EXECUTION_FILE" && -f "$EXECUTION_FILE" ]]; then
            echo "execution_file_bytes=$(wc -c < "$EXECUTION_FILE")"
            jq -c '.. | objects | select(.type? == "system" or .type? == "result" or .type? == "assistant")' "$EXECUTION_FILE"
          else
            echo "Execution file is unavailable"
          fi
          [[ "$ACTION_OUTCOME" == "success" ]]
