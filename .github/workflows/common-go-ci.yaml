name: CI (Go)

on:
  push:
    paths:
      - '**.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.moon/**'
      - '**/moon.yml'
      - '.prototools'
      - '**/.golangci.yaml'
      - '.ko.yaml'
      - '.github/workflows/common-go-ci.yaml'
      - '!**.md'
      - '!docs/**'

# A newer push to the same branch supersedes the running checks. Each main run
# gets its own group, because GitHub drops a queued run when another joins its
# group, even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.1

jobs:
  lint:
    name: Lint
    runs-on: namespace-profile-linux-ci-large
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          fetch-depth: 0 # moon resolves the base revision in CI

      - name: Configure Git for private repos
        run: git config --global url."https://x-token-auth:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          cache: false # Skip GitHub's remote cache; it would only hold ~/.proto

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go
          # .moon/cache keeps moon's task results, so unchanged lint inputs
          # replay without rerunning the linter.
          path: |
            ~/go/pkg
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ${{ github.workspace }}/.moon/cache

      # Share moon's task results across runners through Namespace's remote
      # cache (Bazel API). moon reads the host and token from these variables;
      # .moon/workspace.yml holds only the header template because that file is
      # an input to every task hash. Keep this CI-only: task hashes omit the OS
      # and Go version. Any failure leaves moon on the cache volume alone.
      - name: Connect moon to the Namespace remote cache
        continue-on-error: true
        run: |
          set -euo pipefail
          creds="$RUNNER_TEMP/nsc-bazel.json"
          nsc cache bazel setup -o json --static --static_token_duration 1h > "$creds"
          token=$(jq -er .static_token "$creds")
          echo "::add-mask::$token"
          host=$(jq -er .endpoint "$creds")
          {
            echo "MOON_REMOTE_HOST=$host"
            echo "NSC_REMOTE_CACHE_TOKEN=$token"
          } >> "$GITHUB_ENV"

      - name: Run Go linter
        run: moon run world-engine:lint

  test:
    name: Test
    runs-on: namespace-profile-linux-ci-large
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          fetch-depth: 0 # moon resolves the base revision in CI

      - name: Install moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          cache: false # Skip GitHub's remote cache; it would only hold ~/.proto

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go
          path: |
            ~/go/pkg
            ~/.cache/go-build
            ~/.cache/golangci-lint

      - name: Setup envtest
        id: setup-envtest
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          mkdir -p bin
          setup-envtest use 1.31.0 --bin-dir=bin
          KUBEBUILDER_ASSETS_PATH=$(setup-envtest use 1.31.0 --bin-dir=bin -p path)
          KUBEBUILDER_ASSETS_ABSOLUTE=$(realpath "$KUBEBUILDER_ASSETS_PATH")
          echo "kubebuilder-assets=$KUBEBUILDER_ASSETS_ABSOLUTE" >> $GITHUB_OUTPUT

      - name: Verify envtest setup
        run: |
          echo "KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.kubebuilder-assets }}"
          echo "Directory listing:"
          ls -la "${{ steps.setup-envtest.outputs.kubebuilder-assets }}"
          echo "Checking for etcd binary:"
          ls -la "${{ steps.setup-envtest.outputs.kubebuilder-assets }}/etcd" || echo "etcd not found"
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.kubebuilder-assets }}
      
      - name: Run Go CI tests
        run: moon run world-engine:test-ci
        env:
          KUBEBUILDER_ASSETS: ${{ steps.setup-envtest.outputs.kubebuilder-assets }}

      - name: Run CLI tests
        run: moon run cli:test-ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Argus-Labs/monorepo
          files: |
            **/coverage.out

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: |
            **/junit.xml
