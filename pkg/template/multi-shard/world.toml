# World Engine Configuration
# All commented-out keys are optional with sensible defaults.

# These fields are your project identifier.
organization = "organization"
project = "project"

# How players sign in to every shard. Only `world start` reads this; deployed shards get
# CARDINAL_AUTH_MODE and CARDINAL_ARGUS_AUTH_URL from their deployment instead.
# Without [auth], shards use dev auth, which trusts the X-Player-Id header from any caller
# (the MCP send_command tool needs it). Uncomment to accept Argus Auth game tokens instead:
# [auth]
# mode = "argus"
# url = "https://api.argus.dev"

# Shard definitions
# Each shard's `id` must match its directory name under `shards/` (e.g., shards/game/).
# If you need to use a different directory location, override with the `path` key.

[[shards]]
id = "chat"
# log_level = "info"
# enable_otel = false

[[shards]]
id = "game"
# log_level = "info"
# enable_otel = false


# Example with custom path (uncomment and modify if needed):
# [[shards]]
# id = "matchmaking"
# log_level = "info"
# enable_otel = false
# path = "./custom-path/to-your-shard"  # Override default shards/<id> location
