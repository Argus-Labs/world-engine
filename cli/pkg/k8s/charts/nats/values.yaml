# Values under `nats:` go to the official chart. One node, file-backed JetStream, same as
# the raw NATS manifest world-cli applied before ADR-066.
nats:
  fullnameOverride: nats
  container:
    image:
      tag: 2.12.2
  config:
    cluster:
      enabled: false
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 4Gi
  # No nats-box helper pod locally; `nats` CLI from the host does the same job.
  natsBox:
    enabled: false
