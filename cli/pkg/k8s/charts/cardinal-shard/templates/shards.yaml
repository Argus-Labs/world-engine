{{- $shard := required "shardID is required" .Values.shardID -}}
{{- $image := required "image is required" .Values.image -}}
{{- $tag := required "imageTag is required" .Values.imageTag -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cardinal-pool-{{ $shard }}
  labels:
    cardinal.argus.gg/pool: 'true'
    cardinal.argus.gg/shard-id: {{ $shard }}
data:
  pool-size: {{ .Values.poolSize | quote }}
  image-tag: {{ $tag | quote }}
  configuration-url: {{ .Values.configurationURL | quote }}
{{ range $index := until (int .Values.poolSize) }}
{{- $name := include "cardinal-shard.instanceName" (list $shard $index) -}}
---
# Each instance owns a distinct world. Another pool member cannot replace it
# during an active session, so voluntary node drains must preserve this pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/managed-by: argocd
    cardinal.argus.gg/shard-id: {{ $shard }}
    cardinal.argus.gg/instance: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cardinal.argus.gg/instance: {{ $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-dpl
  annotations:
    argocd.argoproj.io/sync-wave: {{ $index | quote }}
  labels:
    app.kubernetes.io/managed-by: argocd
    cardinal.argus.gg/shard-id: {{ $shard }}
    cardinal.argus.gg/instance: {{ $name }}
    app: {{ $name }}
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      cardinal.argus.gg/instance: {{ $name }}
  template:
    metadata:
      annotations:
        # Protect active worlds from Autopilot scale-downs and upgrades for seven days.
        cluster-autoscaler.kubernetes.io/safe-to-evict: 'false'
      labels:
        app.kubernetes.io/managed-by: argocd
        cardinal.argus.gg/shard-id: {{ $shard }}
        cardinal.argus.gg/instance: {{ $name }}
        app: {{ $name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shard
          image: {{ printf "%s:%s" $image $tag | quote }}
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: CARDINAL_SHARD_ID
              value: {{ $name | quote }}
            - name: CARDINAL_ORG
              value: {{ $.Values.organization | quote }}
            - name: CARDINAL_PROJECT
              value: {{ $.Values.project | quote }}
            - name: CARDINAL_REGION
              value: {{ $.Values.region | quote }}
            - name: LOG_LEVEL
              value: {{ $.Values.logLevel | quote }}
            - name: CARDINAL_SNAPSHOT_STORAGE_TYPE
              value: {{ $.Values.snapshotStorageType | quote }}
            - name: CARDINAL_AUTH_MODE
              value: {{ $.Values.auth.mode | quote }}
            {{- if eq $.Values.auth.mode "ARGUS" }}
            - name: CARDINAL_ARGUS_AUTH_URL
              value: {{ required "auth.argusURL is required when auth.mode is ARGUS" $.Values.auth.argusURL | quote }}
            {{- end }}
            - name: NATS_URL
              value: {{ required "nats.url is required" $.Values.nats.url | quote }}
            {{- with $.Values.database }}
            {{- if .dsn }}
            - name: DB_DSN
              value: {{ .dsn | quote }}
            {{- else if .secret.name }}
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .secret.name }}
                  key: {{ required "database.secret.key is required alongside database.secret.name" .secret.key }}
            {{- end }}
            {{- end }}
            {{- if $.Values.tickRate }}
            - name: CARDINAL_TICK_RATE
              value: {{ $.Values.tickRate | quote }}
            {{- end }}
            {{- if $.Values.mode }}
            - name: CARDINAL_MODE
              value: {{ $.Values.mode | quote }}
            {{- end }}
            - name: CARDINAL_DEBUG
              value: {{ $.Values.debug | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.otlp.endpoint | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "shard.id=%s,service.instance.id=%s" $shard $name | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/managed-by: argocd
    cardinal.argus.gg/shard-id: {{ $shard }}
    cardinal.argus.gg/instance: {{ $name }}
spec:
  selector:
    cardinal.argus.gg/shard-id: {{ $shard }}
    cardinal.argus.gg/instance: {{ $name }}
  ports:
    - name: shard
      port: 8080
      targetPort: 8080
      protocol: TCP
      appProtocol: kubernetes.io/h2c
{{ end }}
