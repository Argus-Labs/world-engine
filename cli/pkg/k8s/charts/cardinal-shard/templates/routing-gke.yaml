{{- if eq .Values.routing.provider "gke" }}
{{- $shard := .Values.shardID }}
{{- range $i := until (int .Values.poolSize) }}
{{- $name := include "cardinal-shard.instanceName" (list $shard $i) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "cardinal-shard.labels" (list $shard $name) | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.routing.gateway.name }}
      {{- with $.Values.routing.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    {{- toYaml $.Values.routing.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /{{ include "cardinal-shard.pathSegment" $.Values.organization }}/{{ include "cardinal-shard.pathSegment" $.Values.project }}/{{ $name }}/worldengine.cardinal.v1.CardinalService
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /worldengine.cardinal.v1.CardinalService
      backendRefs:
        - name: {{ $name }}
          group: ''
          kind: Service
          weight: 1
          port: 8080
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "cardinal-shard.labels" (list $shard $name) | nindent 4 }}
spec:
  targetRef:
    group: ''
    kind: Service
    name: {{ $name }}
  default:
    config:
      type: TCP
      tcpHealthCheck:
        port: 8080
---
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "cardinal-shard.labels" (list $shard $name) | nindent 4 }}
spec:
  targetRef:
    group: ''
    kind: Service
    name: {{ $name }}
  default:
    timeoutSec: 3600
{{- end }}
{{- end }}
