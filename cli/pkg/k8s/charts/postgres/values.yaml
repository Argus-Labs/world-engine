image: postgres:16
user: postgres
password: postgres
# Required. Database created on first start; usually the project name.
database: ''
storage: 1Gi
# ClusterIP for in-cluster only. LoadBalancer makes Docker Desktop and OrbStack publish
# localhost:5432. NodePort takes service.nodePort.
service:
  type: ClusterIP
  nodePort: 0
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
