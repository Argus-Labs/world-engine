# NATS + JetStream for the world-cli local k3d cluster.
#
# This manifest is hand-authored (no upstream kustomize / generator), so
# the file IS the source of truth. The image tag must match
# pkg/version/version.go's `Nats` constant; bump both together.
#
# Applied into namespace `nats` so all projects share one NATS instance.
# Operator pods reach it at nats://nats.nats.svc.cluster.local:4222.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nats
  labels:
    managed-by: world-cli
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats
  namespace: nats
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: nats
data:
  nats.conf: |
    server_name: nats-local
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 256MB
      max_file_store: 2GB
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-jetstream
  namespace: nats
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: nats
  labels:
    app: nats
    managed-by: world-cli
spec:
  replicas: 1
  # Recreate (not RollingUpdate) so the new pod can attach the ReadWriteOnce
  # JetStream PVC without contending with the outgoing one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      serviceAccountName: nats
      containers:
        - name: nats
          image: nats:2.12.2
          args:
            - "-c"
            - "/etc/nats/nats.conf"
          ports:
            - name: client
              containerPort: 4222
            - name: monitoring
              containerPort: 8222
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: jetstream
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: jetstream
          persistentVolumeClaim:
            claimName: nats-jetstream
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: nats
  labels:
    app: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: monitoring
      port: 8222
      targetPort: monitoring
