---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: shardpools.cardinal.argus.gg
spec:
  group: cardinal.argus.gg
  names:
    kind: ShardPool
    listKind: ShardPoolList
    plural: shardpools
    singular: shardpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.shardID
      name: Shard
      type: string
    - jsonPath: .spec.poolSize
      name: Pool Size
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.imageTag
      name: Image Tag
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ShardPool is the Schema for the shardpools API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ShardPoolSpec defines the desired state of a ShardPool.

              Cross-field CEL guard: the controller derives per-instance names as
              "<shardID>-<n>" (n = 2..poolSize) and stamps them verbatim as the value of
              the cardinal.argus.gg/instance label, which Kubernetes caps at 63 bytes.
              The per-field Pattern only bounds shardID alone, so a CRD-admissible 63-char
              ShardID with PoolSize >= 2 would yield a 65-byte "<shardID>-2" that the API
              server rejects on every Create, silently breaking scale-out (the reconcile
              loop early-returns before .status is written). This x-kubernetes-validations
              rule rejects the offending ShardID×PoolSize combination at admission on
              Create, and on Update (Scale RPC) only when shardID or poolSize actually
              change (optionalOldSelf=true + oldSelf.hasValue() guard — a transition rule).
              This avoids permanently blocking updates to other fields (e.g. imageTag) on
              legacy objects that were admitted before this rule shipped. Enforcement that
              a per-field schema cannot express and that would otherwise require a
              cert-manager-backed webhook (none exists in this codebase, and no ShardPool
              webhook is desired).
              It is precise: a 63-char ShardID with PoolSize=1 (no suffix) stays admissible;
              only combinations whose longest derived name exceeds the 63-byte limit are
              rejected. ShardID is constrained to ASCII by its Pattern, so .size() (bytes)
              and rune count coincide.
            properties:
              fullPoolPolicy:
                default: reject
                description: FullPoolPolicy controls behavior when all instances are
                  assigned.
                enum:
                - reject
                - queue
                - auto-scale
                type: string
              image:
                description: Image is the full container image URL (without tag).
                type: string
              imageTag:
                default: latest
                description: |-
                  ImageTag is the container image tag. Managed at runtime by cardinal-operator
                  (Deploy RPC) — intentionally omitted from git manifests so ArgoCD does not
                  revert operator-applied image tag changes.
                type: string
              logLevel:
                default: warn
                description: LogLevel for the shard instances.
                type: string
              maxPoolSize:
                description: MaxPoolSize is the maximum allowed pool size for scaling.
                format: int32
                minimum: 1
                type: integer
              minPoolSize:
                description: MinPoolSize is the minimum allowed pool size for scaling.
                format: int32
                minimum: 1
                type: integer
              mode:
                description: Mode is the shard mode (e.g. "LEADER").
                type: string
              organization:
                description: Organization is the org that owns this game.
                type: string
              poolSize:
                default: 1
                description: |-
                  PoolSize is the desired number of shard instances. Managed at runtime by
                  cardinal-operator (Scale RPC) — intentionally omitted from git manifests
                  so ArgoCD does not revert operator-applied scale changes.
                format: int32
                minimum: 1
                type: integer
              project:
                description: Project is the game project name.
                type: string
              recyclePolicy:
                default: Retain
                description: RecyclePolicy controls what happens to an instance after
                  a session ends.
                enum:
                - Retain
                - Restart
                type: string
              region:
                description: Region is the deployment region.
                type: string
              resources:
                description: Resources defines CPU and memory for each shard instance.
                properties:
                  limits:
                    description: Limits is the maximum allowed usage (CPU/memory).
                    properties:
                      cpu:
                        description: CPU in milliCPU units.
                        format: int32
                        minimum: 1
                        type: integer
                      memory:
                        description: Memory in MiB.
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - cpu
                    - memory
                    type: object
                  requests:
                    description: Requests is the guaranteed reservation (CPU/memory).
                    properties:
                      cpu:
                        description: CPU in milliCPU units.
                        format: int32
                        minimum: 1
                        type: integer
                      memory:
                        description: Memory in MiB.
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - cpu
                    - memory
                    type: object
                required:
                - limits
                - requests
                type: object
              sessionTTLSeconds:
                description: SessionTTLSeconds is the maximum lifetime for a session
                  before force-restart.
                format: int64
                type: integer
              shardID:
                description: ShardID is the logical pool name (e.g. "lobby"). Pattern
                  follows the K8s label-value grammar — operator injects ShardID into
                  OTEL_RESOURCE_ATTRIBUTES, so `,` and `=` are excluded. Same pattern
                  enforced on StreamSpansRequest.shard_id.
                minLength: 1
                pattern: ^[a-z0-9A-Z]([-a-z0-9A-Z_.]{0,61}[a-z0-9A-Z])?$
                type: string
              tickRate:
                description: TickRate is the game loop tick rate in Hz.
                format: int32
                minimum: 1
                type: integer
            required:
            - image
            - organization
            - project
            - region
            - resources
            - shardID
            type: object
            x-kubernetes-validations:
            - message: ShardID plus the PoolSize suffix must not exceed the 63-byte
                Kubernetes label-value limit
              optionalOldSelf: true
              rule: '(oldSelf.hasValue() && self.shardID == oldSelf.value().shardID
                && self.poolSize == oldSelf.value().poolSize) || self.shardID.size()
                + (self.poolSize > 1 ? (1 + string(self.poolSize).size()) : 0) <=
                63'
          status:
            description: ShardPoolStatus defines the observed state of a ShardPool.
            properties:
              activeCount:
                description: ActiveCount is the number of assigned (in-session) instances.
                format: int32
                type: integer
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              idleCount:
                description: IdleCount is the number of idle (available) instances.
                format: int32
                type: integer
              instances:
                description: Instances is the status of each shard instance.
                items:
                  description: ShardInstanceStatus is the status of a single shard
                    instance.
                  properties:
                    deploymentName:
                      description: DeploymentName is the Kubernetes Deployment name.
                      type: string
                    lastTerminationReason:
                      description: LastTerminationReason is the reason the container
                        last terminated (e.g. "OOMKilled", "Error").
                      type: string
                    name:
                      description: Name is the instance name (e.g. "lobby" or "gameplay-3").
                      type: string
                    nodeName:
                      description: NodeName is the node the pod is scheduled on.
                      type: string
                    phase:
                      description: Phase is the instance phase.
                      enum:
                      - Creating
                      - Running
                      - Idle
                      - Assigned
                      - Draining
                      - Failed
                      type: string
                    playerCount:
                      description: PlayerCount is the number of connected players.
                      format: int32
                      type: integer
                    podIP:
                      description: PodIP is the IP address of the pod.
                      type: string
                    podName:
                      description: PodName is the name of the pod running this instance.
                      type: string
                    ready:
                      description: Ready indicates whether the container is passing
                        readiness checks.
                      type: boolean
                    restartCount:
                      description: RestartCount is the number of times the container
                        has been restarted.
                      format: int32
                      type: integer
                    sessionID:
                      description: SessionID is the current session ID, if assigned.
                      type: string
                    startedAt:
                      description: StartedAt is when the container last started.
                      format: date-time
                      type: string
                  required:
                  - deploymentName
                  - name
                  - phase
                  type: object
                type: array
              observedImageTag:
                description: ObservedImageTag is the image tag currently deployed.
                type: string
              phase:
                default: Pending
                description: Phase is the overall pool phase.
                enum:
                - Pending
                - Ready
                - Degraded
                - Failed
                type: string
              poolSize:
                description: PoolSize is the current number of instances.
                format: int32
                type: integer
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
