$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'go'
toolchains:
  default: 'system'

tasks:
  lint:
    description: 'Lint the World CLI'
    command: '../bin/tools/golangci-lint run --timeout 10m ./...'
    deps: ['world-engine:setup-lint']
    inputs: ['**/*.go', '/go.mod', '/go.sum', '.golangci.yaml', 'moon.yml']
  test:
    description: 'Run World CLI unit tests'
    command: 'go test ./...'
  test-ci:
    description: 'Run World CLI unit tests with coverage'
    command: 'go test -coverprofile coverage.out -covermode atomic ./...'
    inputs: ['**/*.go', '/go.mod', '/go.sum', 'moon.yml']
    outputs: ['coverage.out']
    options:
      runInCI: true
  test-integration:
    description: 'Run World CLI integration tests (requires Docker)'
    command: 'go test -tags=integration -timeout=15m ./...'
    options:
      runInCI: false
  build:
    description: 'Build the World CLI'
    command: 'go build ./...'
    options:
      runInCI: true
  install:
    description: 'Install the World CLI from source into GOBIN'
    command: 'go install ./cmd/world'
  generate:
    description: 'Regenerate the Cardinal Operator Connect and protobuf code'
    command: 'buf generate'
    options:
      runFromWorkspaceRoot: false
