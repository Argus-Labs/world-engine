$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
toolchains:
  default: 'system'

tasks:
  build:
    description: 'Type-check generated TypeScript (run npm install first)'
    options:
      runInCI: true
    command: 'npm run build'

  test:
    description: 'Emit the TypeScript client as JavaScript and import it in Node ESM (run npm install first)'
    options:
      runInCI: true
    command: 'npm test'
